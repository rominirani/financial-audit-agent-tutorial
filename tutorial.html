# Hands-On Tutorial: Building an Autonomous Financial Audit Agent Team with Antigravity + Google Cloud
*A complete step-by-step guide to building, testing, and deploying a multi-agent financial reconciliation workflow using the Google Antigravity SDK and Google Cloud Platform.*

---

### Why the Google Antigravity SDK?

Building a production-grade multi-agent system from raw LLM API calls means solving a long list of infrastructure problems yourself: agent lifecycle management, tool registration and schema generation, inter-agent communication, policy enforcement, observability hooks, and safe concurrency — before you write a single line of business logic.

The **Google Antigravity SDK** (`google-antigravity`) is a Python framework purpose-built for exactly this. It provides the primitives that let you focus on *what* your agents should do rather than *how* to wire them together:

| Capability | What the SDK Provides |
|:---|:---|
| **Agent Configuration** | `LocalAgentConfig` — declarative agent definitions with system instructions, tools, and sub-agent spawning via `CapabilitiesConfig` |
| **Tool Registration** | Pass plain Python functions as `tools=[...]`. The SDK auto-generates schemas from type hints and docstrings — no manual OpenAPI specs |
| **Safety Policies** | `policy.allow()`, `policy.deny()`, `policy.ask_user()` — composable, argument-level rules that gate every tool call before execution |
| **Lifecycle Hooks** | `@on_session_start`, `@post_tool_call`, `@on_session_end` — inject logging, tracing, and alerting without modifying agent logic |
| **Vertex AI Integration** | Native connection to Gemini models on Vertex AI — no API key management, uses Application Default Credentials |
| **Conversation Management** | Built-in session context, token tracking (`conversation.total_usage`), and multi-turn memory |

The SDK's design philosophy is **separation of concerns**. Your agent's *reasoning* (system instructions + tools) is defined independently from its *governance* (policies + hooks). This means you can swap from a permissive development policy to a locked-down production policy without changing a single line of agent code — a pattern you'll see throughout this tutorial.

In this tutorial, you'll use the SDK to build a team of four agents that collectively perform a financial reconciliation audit. Each agent gets its own scoped configuration, tools, and policies. The Orchestrator spawns specialist sub-agents, the policy engine enforces least-privilege access, and the hook system generates a complete compliance audit trail to Cloud Logging and Cloud Trace — all with the SDK handling the infrastructure plumbing.

---

### Section 1: Overview

**1.1 What You'll Build**

In this tutorial, you will build an autonomous, multi-agent financial audit system capable of reconciling vendor transactions against PDF invoices. Instead of relying on a single large language model prompt, you will architect a team of specialized agents, each with scoped responsibilities, strict security boundaries, and distinct capabilities. 

This agent team consists of:
- **Audit Orchestrator** — The manager. It holds the high-level objective, delegates tasks to subagents, and manages the 4-phase workflow state machine (trigger, gather, reconcile, report).
- **Data Researcher Agent** — A read-only specialist tasked with querying BigQuery for pending vendor transactions.
- **Invoice Analyzer Agent** — A read-only specialist that locates and extracts structured line-item data from PDF invoices stored in Google Cloud Storage (GCS).
- **Reconciliation Engine Agent** — The analytical core. It receives data from the Researcher and Analyzer, matches transactions to invoices, verifies tax calculations, and flags mismatches.
- **Human Compliance Gate** — Not an AI, but a declarative policy hook that pauses execution and escalates any discrepancy above $1,000 to a human compliance officer for manual review before writing results.

Why not just give one agent access to everything? Because a single agent with BigQuery write access, GCS access, and command execution creates an unacceptable blast radius. By organizing the workflow as a multi-agent team, we implement the principle of least privilege, isolate the complex reasoning, and create a verifiable chain of custody for every decision.

```mermaid
graph TD
    subgraph "Agent Team"
        O[Audit Orchestrator]
        O -->|Spawns| R[Data Researcher Agent]
        O -->|Spawns| I[Invoice Analyzer Agent]
        O -->|Spawns| E[Reconciliation Engine Agent]
    end
    
    subgraph "Human Governance"
        H[Human Compliance Gate]
    end
    
    E -.->|Discrepancy > $1000| H
```

### Section 3: Architecture

Understanding the architecture is crucial before writing code. We separate concerns between the Agent Runtime, the Data Layer, and Human Governance.

**Diagram 1 — System Architecture**

**Diagram 3 — Security Boundary Map: SDK Policies × GCP Services**

This diagram maps two layers of security. The **SDK Policy Layer** controls what each agent can do at the tool level. The **GCP IAM Layer** controls what the service account can access at the infrastructure level. Both must allow an action for it to succeed.

```mermaid
graph TB
    subgraph LAYER1["🛡️ Antigravity SDK Policy Layer — Per-Agent Permissions"]
        direction TB
        
        subgraph ORCH["Orchestrator"]
            O_ALLOW["✅ delegate_to_data_researcher<br/>✅ delegate_to_invoice_analyzer<br/>⚠️ ask_user — delegate_to_reconciler"]
            O_DENY["❌ query_vendor_transactions<br/>❌ read_invoice_from_gcs<br/>❌ write_audit_result"]
        end
        
        subgraph DR["Data Researcher"]
            DR_ALLOW["✅ query_vendor_transactions<br/>✅ list_invoices_in_gcs"]
            DR_DENY["❌ INSERT / UPDATE / DELETE<br/>❌ write_audit_result<br/>❌ read_invoice_from_gcs"]
        end
        
        subgraph IA["Invoice Analyzer"]
            IA_ALLOW["✅ read_invoice_from_gcs"]
            IA_DENY["❌ list_invoices_in_gcs<br/>❌ write_audit_result<br/>❌ query_vendor_transactions"]
        end
        
        subgraph RE["Reconciler"]
            RE_ALLOW["✅ write_audit_result — audit_results table only"]
            RE_DENY["❌ query_vendor_transactions<br/>❌ read_invoice_from_gcs<br/>❌ run_command"]
        end
    end

    subgraph LAYER2["🔐 GCP IAM Layer — Service Account: audit-agent-sa"]
        direction LR
        BQ["BigQuery<br/>roles/bigquery.dataEditor<br/>roles/bigquery.jobUser"]
        GCS["Cloud Storage<br/>roles/storage.objectViewer"]
        CL["Cloud Logging<br/>roles/logging.logWriter"]
        CT["Cloud Trace<br/>roles/cloudtrace.agent"]
    end

    DR_ALLOW -->|"SELECT queries"| BQ
    DR_ALLOW -->|"List invoice PDFs"| GCS
    IA_ALLOW -->|"Read invoice PDFs"| GCS
    RE_ALLOW -->|"INSERT audit_results"| BQ
    O_ALLOW -.->|"via hooks"| CL
    O_ALLOW -.->|"via hooks"| CT
```

**Security permission matrix — which agent can touch which GCP service:**

| Agent | BigQuery READ | BigQuery WRITE | GCS LIST | GCS READ | Cloud Logging | Cloud Trace |
|:---|:---:|:---:|:---:|:---:|:---:|:---:|
| **Orchestrator** | ❌ | ❌ | ❌ | ❌ | ✅ (via hooks) | ✅ (via hooks) |
| **Data Researcher** | ✅ SELECT only | ❌ | ✅ list only | ❌ | ✅ (via hooks) | ✅ (via hooks) |
| **Invoice Analyzer** | ❌ | ❌ | ❌ | ✅ read only | ✅ (via hooks) | ✅ (via hooks) |
| **Reconciler** | ❌ | ✅ audit_results only | ❌ | ❌ | ✅ (via hooks) | ✅ (via hooks) |

> **🔑 Key Insight:** Notice the **defense in depth**. Even if the Data Researcher's LLM were prompt-injected to attempt a `DELETE FROM vendor_transactions`, it would be blocked at *two* levels: the SDK policy engine rejects non-SELECT queries, and the BigQuery IAM role only grants `dataEditor` on the `financial_audit` dataset (not `bigquery.admin`). The Invoice Analyzer can list and read PDFs from GCS but has zero BigQuery access. The Orchestrator itself has no direct data access — it can only delegate to scoped subagents.

The data flow is strictly controlled. The Orchestrator manages state and escalation but does not touch raw data. The Researcher and Analyzer are read-only. The Reconciler can only write to specific output locations.

This illustrates the **principle of least privilege** applied to AI. Each agent's policy represents the MINIMUM set of permissions required for its specific job. The Researcher doesn't need to read PDFs, so it doesn't get GCS access. The Analyzer doesn't need database access, so BigQuery is denied. This compartmentalization ensures that even if an agent hallucinates or is subjected to prompt injection via a malicious invoice PDF, it cannot compromise the broader system.

### Section 4: Step-by-Step GCP Provisioning

**Step 4.1: Create Project & Enable APIs**

Start by creating a dedicated GCP project and enabling the six cloud services your agent team will use. Each API corresponds to a specific role: BigQuery for data, Cloud Storage for PDFs, Cloud Logging and Cloud Trace for observability, and Cloud Run for future deployment.

```bash
export PROJECT_ID="financial-audit-tutorial"
gcloud projects create $PROJECT_ID --name="Financial Audit Tutorial"
gcloud config set project $PROJECT_ID
gcloud services enable bigquery.googleapis.com storage.googleapis.com logging.googleapis.com cloudtrace.googleapis.com secretmanager.googleapis.com run.googleapis.com
```

> **💡 Tip:** Ensure your GCP project has billing linked using `gcloud billing projects link $PROJECT_ID --billing-account=YOUR_ACCOUNT_ID`. Also, all `gcloud` commands in this section assume you have already authenticated using `gcloud auth login`.

**Step 4.2: Create BigQuery Dataset & Tables**

We only create two tables: `vendor_transactions` (the ERP source of truth) and `audit_results` (where the agent writes findings). Invoice data is **not** pre-loaded into BigQuery — the agent extracts it from PDF files stored in GCS.

```bash
bq mk --dataset $PROJECT_ID:financial_audit

# Create vendor_transactions — the ERP source of truth
bq mk --table $PROJECT_ID:financial_audit.vendor_transactions \
vendor_id:STRING,vendor_name:STRING,invoice_num:STRING,amount:FLOAT64,currency:STRING,tax_rate:FLOAT64,status:STRING,quarter:STRING,transaction_date:DATE

# Create audit_results — the agent writes its findings here
bq mk --table $PROJECT_ID:financial_audit.audit_results \
execution_id:STRING,vendor_id:STRING,invoice_num:STRING,transaction_amount:FLOAT64,invoice_amount:FLOAT64,discrepancy_amount:FLOAT64,status:STRING,agent_notes:STRING,reviewed_by:STRING,timestamp:TIMESTAMP
```

> **📝 Note:** We intentionally plant discrepancies between the transaction records (BigQuery) and the invoice PDFs (GCS) to test the agent's analytical capabilities:
> - **Vendor 8492**: The ERP transaction records $142,300 at 8.5% tax, but the vendor's PDF invoice shows $138,750 at 6.25% tax.
> - **Vendor 3301**: The ERP transaction is recorded in USD, but the vendor's PDF invoice is denominated in EUR.
> - **Vendor 5567**: The ERP has two transactions with the same invoice number but different amounts ($23,400 and $24,100), while only one PDF invoice exists.
> 
> The agent must discover these discrepancies by reading both data sources — it is never told where the errors are.

Populate the transactions table with ERP data. These represent what your company's accounting system has recorded — amounts, tax rates, currencies, and invoice numbers. Think of this as the "source of truth" from the internal financial system:
```sql

(vendor_id, vendor_name, invoice_num, amount, currency, tax_rate, status, quarter, transaction_date) VALUES

('1022', 'OfficeSupplies Co', 'INV-1022-Q3-014', 4500.00, 'USD', 0.05, 'PENDING', 'Q3', '2026-07-20'),
('3301', 'Global Services Ltd', 'INV-3301-Q3-099', 87500.00, 'USD', 0.10, 'PENDING', 'Q3', '2026-08-01'),
('5567', 'Consulting Group Inc', 'INV-5567-Q3-001', 23400.00, 'USD', 0.0, 'PENDING', 'Q3', '2026-08-10'),
('5567', 'Consulting Group Inc', 'INV-5567-Q3-001', 24100.00, 'USD', 0.0, 'PENDING', 'Q3', '2026-08-12');

**Step 4.3: Create GCS Bucket and Upload Invoice PDFs**

If you followed Section 1.3, you already have 4 sample invoice PDFs in `data/invoices/`. Now create a Cloud Storage bucket and upload them. The `-l us-central1` flag co-locates the bucket with your BigQuery dataset for low-latency access:

```bash
# Create a regional bucket for invoice PDFs
gsutil mb -l us-central1 gs://$PROJECT_ID-audit-invoices

# Upload all generated invoices into a Q3/ prefix
gsutil -m cp data/invoices/*.pdf gs://$PROJECT_ID-audit-invoices/Q3/

# Verify uploads — you should see 4 PDF files
gsutil ls gs://$PROJECT_ID-audit-invoices/Q3/
```

> **💡 Tip:** The `Q3/` prefix organizes invoices by quarter. The agent's `list_invoices_in_gcs()` tool filters by this prefix when searching for invoices to reconcile.


**Step 4.4: Create Service Account with Least-Privilege IAM**

Create a dedicated service account for the audit agent and grant it only the minimum IAM roles required. Each role maps to a specific capability: `dataViewer` for reading BigQuery tables, `jobUser` for running queries, `logWriter` for writing structured audit logs, `cloudtrace.agent` for publishing trace spans, and `storage.objectViewer` for reading invoice PDFs from GCS. The agent cannot delete data, modify tables, or access other projects.

```bash
# Create the service account
gcloud iam service-accounts create audit-agent-sa \
    --display-name="Audit Agent Service Account"

SA_EMAIL="audit-agent-sa@$PROJECT_ID.iam.gserviceaccount.com"

# BigQuery: read transactions + write audit results
gcloud projects add-iam-policy-binding $PROJECT_ID \
    --member="serviceAccount:$SA_EMAIL" \
    --role="roles/bigquery.dataViewer" --condition=None
gcloud projects add-iam-policy-binding $PROJECT_ID \
    --member="serviceAccount:$SA_EMAIL" \
    --role="roles/bigquery.jobUser" --condition=None

# Cloud Logging: write structured audit events
gcloud projects add-iam-policy-binding $PROJECT_ID \
    --member="serviceAccount:$SA_EMAIL" \
    --role="roles/logging.logWriter" --condition=None

# Cloud Trace: publish distributed trace spans
gcloud projects add-iam-policy-binding $PROJECT_ID \
    --member="serviceAccount:$SA_EMAIL" \
    --role="roles/cloudtrace.agent" --condition=None

# Cloud Storage: read-only access to invoice PDFs
gcloud projects add-iam-policy-binding $PROJECT_ID \
    --member="serviceAccount:$SA_EMAIL" \
    --role="roles/storage.objectViewer" --condition=None
```

> **💡 Tip:** The `--condition=None` flag is required when your project already has conditional IAM policies. Without it, the command will fail with a `"Adding a binding without specifying a condition is prohibited"` error.



**Step 4.5: Verify Setup**

Before writing any code, verify that all infrastructure was provisioned correctly. These two commands confirm the BigQuery dataset exists and the service account has the expected IAM roles:

```bash
# Verify BigQuery dataset and tables exist
bq ls $PROJECT_ID:financial_audit

# Verify IAM roles assigned to the service account
gcloud projects get-iam-policy $PROJECT_ID \
  --flatten="bindings[].members" \
  --format='table(bindings.role)' \
  --filter="bindings.members:audit-agent-sa"
```

You should see `roles/bigquery.dataViewer`, `roles/bigquery.jobUser`, `roles/logging.logWriter`, `roles/cloudtrace.agent`, and `roles/storage.objectViewer` in the output.

### Section 5: Antigravity SDK Code — Step by Step

**Step 5.1: Clone the Repository and Install Dependencies**

Clone the repository, set up a Python virtual environment, and install the dependencies. `google-antigravity` is the SDK itself; `google-cloud-bigquery` and `google-cloud-storage` provide the GCP client libraries your tools will wrap; `reportlab` generates sample invoice PDFs; and `PyPDF2` enables PDF text extraction at runtime:

```bash
git clone https://github.com/rominirani/financial-audit-agent-tutorial.git
cd financial-audit-agent-tutorial
python -m venv .venv && source .venv/bin/activate
pip install -r requirements.txt
```

**Step 5.2: Define Custom Tools**

Agents need tools to interact with external systems. In this tutorial, we define custom Python functions that wrap the Google Cloud client libraries (`google-cloud-bigquery` and `google-cloud-storage`) and pass them to the agent via the `tools` parameter in `LocalAgentConfig`.

| Tool | Purpose | Assigned To |
|:---|:---|:---|
| `query_vendor_transactions()` | Query BigQuery for pending transactions | Data Researcher only |
| `list_invoices_in_gcs()` | List all invoice PDFs in the GCS bucket | Data Researcher only |
| `read_invoice_from_gcs()` | Read and extract structured data from an invoice PDF | Invoice Analyzer only |
| `write_audit_result()` | Write reconciliation results to BigQuery | Reconciler only |
| `delegate_to_data_researcher()` | Spawn Data Researcher subagent | Orchestrator only |
| `delegate_to_invoice_analyzer()` | Spawn Invoice Analyzer subagent | Orchestrator only |
| `delegate_to_reconciler()` | Spawn Reconciler subagent | Orchestrator only |

Each tool is a standard Python function with type hints and a descriptive docstring. The SDK automatically registers them as callable tools the agent can invoke — the agent sees a list of available functions with descriptions and calls them as needed.

**Step 5.2b: Implement the Tools** (`tools/bigquery_tools.py`)

This file contains all four tool functions. Each function wraps a Google Cloud client library call and returns a JSON string that the agent can parse and reason over.

```python
from google.cloud import bigquery, storage
import json
import os

PROJECT_ID = os.environ.get("PROJECT_ID", "YOUR_PROJECT_ID")

**Step 5.2c: Implement Delegation Tools** (`tools/delegation_tools.py`)

This is the key file that makes multi-agent delegation real. Instead of giving the Orchestrator direct access to the data tools, we wrap each subagent as a **delegation tool** — a Python function the Orchestrator calls that internally spawns a specialist subagent with restricted tool access, runs it, and returns the result.

This enforces true separation of concerns:
- The **Data Researcher** gets `query_vendor_transactions` and `list_invoices_in_gcs` (read-only)
- The **Invoice Analyzer** gets `read_invoice_from_gcs` (read-only)
- The **Reconciler** gets `write_audit_result` (write access, governed by policy tier)
- The **Orchestrator** gets NONE of the above — only the delegation tools

```python
from google.antigravity import Agent

# Module-level config — set by main.py before the orchestrator starts
_project_id = None
_workspace = None
_reconciler_policies = None

# Accumulated FULL results from prior delegation calls.
# The reconciler reads these directly; the orchestrator only sees summaries.
_research_results = None
_invoice_results = []
_expected_invoice_paths = []  # Parsed from data researcher results


def configure(project_id: str, workspace: str, reconciler_policies: list):
    """Initialize delegation config. Called once from main.py before agent starts.

    Args:
        project_id: GCP project ID for Vertex AI routing.
        workspace: Absolute path to the project workspace directory.
        reconciler_policies: Mode-dependent policy list (dev/staging/prod).
    """
    global _project_id, _workspace, _reconciler_policies
    global _research_results, _invoice_results, _expected_invoice_paths
    _project_id = project_id
    _workspace = workspace
    _reconciler_policies = reconciler_policies
    # Reset accumulated results for each new run
    _research_results = None
    _invoice_results = []
    _expected_invoice_paths = []


def _truncate(text: str, max_chars: int = 500) -> str:
    """Truncate text to keep orchestrator context manageable."""
    if len(text) <= max_chars:
        return text
    return text[:max_chars] + f"\n... [truncated — full data ({len(text)} chars) saved for reconciler]"


async def delegate_to_data_researcher(quarter: str = "Q3") -> str:
    """Delegate to the Data Researcher subagent to query BigQuery for
    pending vendor transactions and list invoice PDFs in GCS.

    The Data Researcher has READ-ONLY access to BigQuery and GCS.
    It cannot write audit results or modify any data.

    Args:
        quarter: The fiscal quarter to query (e.g., "Q3").

    Returns:
        Summary of transaction records and invoice file listings.
    """
    global _research_results
    from agents.data_researcher import get_data_researcher_config

    config = get_data_researcher_config(
        workspace=_workspace,
        project_id=_project_id,
    )

    async with Agent(config) as researcher:
        response = await researcher.chat(
            f"Query all PENDING vendor transactions for quarter '{quarter}' "
            f"from BigQuery. Also list all invoice PDF files in the GCS bucket. "
            f"Return the complete results as structured JSON."
        )
        result = await response.text()
        # Store full result for the reconciler
        _research_results = result
        # Extract invoice paths from the result for the guardrail
        import re
        _expected_invoice_paths.clear()
        for match in re.findall(r'(Q\d+/INV-[\w-]+\.pdf)', result):
            if match not in _expected_invoice_paths:
                _expected_invoice_paths.append(match)
        # Return concise summary so orchestrator knows what was found
        invoice_list = ', '.join(_expected_invoice_paths) if _expected_invoice_paths else 'none found'
        return (
            f"✅ Data Researcher complete. Found {len(_expected_invoice_paths)} invoices "
            f"to analyze: [{invoice_list}]. "
            f"You MUST call delegate_to_invoice_analyzer() for each one before reconciling."
        )


async def delegate_to_invoice_analyzer(invoice_path: str) -> str:
    """Delegate to the Invoice Analyzer subagent to read and extract
    structured data from a single invoice PDF in GCS.

    The Invoice Analyzer has READ-ONLY access to GCS.
    It cannot query BigQuery or write any data.

    Args:
        invoice_path: Path to the invoice PDF in GCS (e.g., "Q3/INV-8492-Q3-001.pdf").

    Returns:
        Summary of extracted invoice fields.
    """
    from agents.invoice_analyzer import get_invoice_analyzer_config

    config = get_invoice_analyzer_config(
        workspace=_workspace,
        project_id=_project_id,
    )

    async with Agent(config) as analyzer:
        response = await analyzer.chat(
            f"Read the invoice PDF at path '{invoice_path}' from the GCS bucket. "
            f"Extract all structured fields: vendor_id, vendor_name, invoice_num, "
            f"base_amount, tax_rate, tax_amount, total_amount, and currency. "
            f"Return the extracted data as a JSON object."
        )
        result = await response.text()
        # Store full result for the reconciler
        _invoice_results.append(result)
        # Return concise summary with path echo so orchestrator tracks progress
        return f"✅ Invoice '{invoice_path}' analyzed ({len(_invoice_results)} total so far). {_truncate(result)}"


async def delegate_to_reconciler(execution_id: str = "AUDIT-Q3") -> str:
    """Delegate to the Reconciliation Engine subagent to compare transactions
    against invoices, classify findings, and write audit results to BigQuery.

    The Reconciler automatically receives all transaction and invoice data
    collected by prior delegation calls. You do NOT need to pass the data —
    it is injected from the accumulated results.

    The Reconciler is the ONLY subagent with write access to BigQuery
    (subject to the current policy tier: dev/staging/prod).

    Args:
        execution_id: Unique ID for this audit run (default: "AUDIT-Q3").

    Returns:
        Text report with reconciliation findings and write confirmations.
    """
    # GUARDRAIL: Refuse to reconcile if not all invoices have been analyzed
    if _expected_invoice_paths:
        analyzed_count = len(_invoice_results)
        expected_count = len(_expected_invoice_paths)
        if analyzed_count < expected_count:
            return (
                f"❌ BLOCKED: Only {analyzed_count} of {expected_count} invoices have been "
                f"analyzed. You must call delegate_to_invoice_analyzer() for ALL invoices "
                f"before reconciling. Missing invoices: analyze the remaining "
                f"{expected_count - analyzed_count} invoice(s) first, then call "
                f"delegate_to_reconciler() again."
            )

    from agents.reconciler import get_reconciler_config

    config = get_reconciler_config(
        policies=_reconciler_policies,
        workspace=_workspace,
        project_id=_project_id,
    )

    # Build the combined data payload from accumulated FULL results
    invoices_combined = "\n---\n".join(_invoice_results) if _invoice_results else "No invoices analyzed."

    async with Agent(config) as reconciler:
        response = await reconciler.chat(
            f"Reconcile the following transaction records against the extracted "
            f"invoice data. For each transaction-invoice pair:\n"
            f"  - Match by vendor_id and invoice_num\n"
            f"  - Compare transaction amount vs invoice total_amount (tolerance: $0.01)\n"
            f"  - Verify tax_rate matches\n"
            f"  - Check currency consistency\n"
            f"  - Classify as MATCHED, DISCREPANCY, or UNMATCHED\n"
            f"  - If discrepancy exceeds $1,000, set status to ESCALATED\n\n"
            f"For EACH reconciled pair, call write_audit_result() with "
            f"execution_id='{execution_id}'.\n\n"
            f"TRANSACTIONS:\n{_research_results}\n\n"
            f"INVOICES:\n{invoices_combined}\n\n"
            f"After writing all results, produce a summary of your findings."
        )
        return await response.text()


DELEGATION_TOOLS = [
    delegate_to_data_researcher,
    delegate_to_invoice_analyzer,
    delegate_to_reconciler,
]
```

> 📎 See the complete implementation: [delegation_tools.py](https://github.com/rominirani/financial-audit-agent-tutorial/blob/main/tools/delegation_tools.py)

**How delegation works under the hood:** Each delegation function creates a fresh `Agent` instance using the subagent's `LocalAgentConfig`, sends it a task-specific prompt, waits for the response, and returns the text result to the Orchestrator. The subagent lives only for the duration of that function call — it's created, executes, and is torn down. This means each subagent is **completely isolated**: it has its own tools, its own policies, and its own Vertex AI session.

> **🔑 Key Insight:** The delegation tools pattern gives you the best of both worlds: the Orchestrator controls *what* gets delegated and *when*, but each subagent controls *how* the work is done within its restricted sandbox. The Orchestrator never touches BigQuery or GCS directly — it can only interact with data through its specialist subagents.

**Step 5.3: Define Safety Policies** (`policies/audit_policies.py`)

Safety policies are the SDK's mechanism for controlling what agents can and cannot do. Each policy tier represents a different level of trust. The key difference: **staging** requires a human at the terminal to approve writes, while **production** runs fully autonomously with argument-level validation. The `compliance_officer_approval_handler` simulates a human gate — in a real deployment, you'd replace the `input()` call with a Slack notification or approval workflow:

```python
from google.antigravity.hooks import policy

VALID_STATUSES = {"MATCHED", "DISCREPANCY", "ESCALATED", "UNMATCHED"}

async def compliance_officer_approval_handler(tool_call) -> bool:
    """Escalation handler for high-risk actions in staging.

    Receives a types.ToolCall object. Use tool_call.name for the tool name
    and tool_call.args for the arguments dict.
    """
    # Pull accumulated context from delegation tools for a richer prompt
    try:
        import tools.delegation_tools as dt
        invoice_count = len(dt._invoice_results)
        has_research = dt._research_results is not None
    except Exception:
        invoice_count = 0
        has_research = False

    execution_id = tool_call.args.get("execution_id", "AUDIT-Q3")

    print(f"\n{'='*60}")
    print(f"🚨 COMPLIANCE OFFICER APPROVAL REQUIRED 🚨")
    print(f"{'='*60}")
    print(f"")
    print(f"  Action:       Delegate to Reconciliation Engine")
    print(f"  Execution ID: {execution_id}")
    print(f"  Data Ready:   {'✅ Transactions loaded' if has_research else '❌ No transaction data'}")
    print(f"  Invoices:     {invoice_count} PDF(s) analyzed")
    print(f"")
    print(f"  ⚠️  The Reconciler will:")
    print(f"     1. Compare transactions against invoice data")
    print(f"     2. Classify each pair (MATCHED / DISCREPANCY / ESCALATED)")
    print(f"     3. WRITE audit results to BigQuery")
    print(f"")
    print(f"{'='*60}")

    response = input("  Approve reconciliation and BigQuery writes? (y/n): ")
    print()
    return response.lower() == 'y'


# --- Development: full permissions, no restrictions ---
DEVELOPMENT_POLICIES = [
    policy.allow_all(),
]


# --- Staging: human approval required before reconciler writes to BigQuery ---
# The orchestrator only has delegation tools (no direct data access), so
# we don't need deny_all. We just gate the reconciler behind human approval.
STAGING_POLICIES = [
    policy.allow("delegate_to_data_researcher"),
    policy.allow("delegate_to_invoice_analyzer"),
    # Reconciler delegation — human must approve (triggers BigQuery writes)
    policy.ask_user("delegate_to_reconciler", handler=compliance_officer_approval_handler),
]


# --- Production: fully autonomous, no human prompts ---
# All delegation tools auto-allowed. Each subagent enforces its own
# internal policies (e.g., the reconciler validates write_audit_result status).
PRODUCTION_POLICIES = [
    policy.allow_all(),
]
```

Notice the three distinct policy tiers and the critical difference between staging and production:
- **DEVELOPMENT_POLICIES**: Uses `allow_all()`, meaning the agent can do anything. Use this *only* on your local machine for rapid iteration and debugging.
- **STAGING_POLICIES**: Uses delegation tool names. Spawning the researcher and analyzer are auto-allowed, but `delegate_to_reconciler` triggers the `compliance_officer_approval_handler` which pauses the agent and prompts you via `stdin`. You review the accumulated data context before approving the reconciliation step.
- **PRODUCTION_POLICIES**: Uses `allow_all()` at the Orchestrator level. The defense-in-depth is moved to the Reconciler subagent itself, which enforces its own write validation policy.

> **⚠️ Important:** Policy tool names must match the **registered function names** — not generic categories. Since the Orchestrator only has delegation tools, those are the exact strings used in `policy.allow()` and `policy.ask_user()`.

**Step 5.4: Define the Agent Team**

Each agent in the team gets its own configuration file defining its system instructions (the "job description"), permitted tools, and security policies. The key architectural decision: **the Orchestrator does NOT get direct access to data tools**. Instead, it gets the delegation tools from Step 5.2c, which spawn isolated subagents to do the actual work.

`agents/orchestrator.py` — The lead auditor. It coordinates the 4-phase workflow by **delegating to specialist subagents** via the delegation tools. Notice it imports `DELEGATION_TOOLS` (not `AUDIT_TOOLS`) — the Orchestrator cannot touch BigQuery or GCS directly:
```python
from google.antigravity import LocalAgentConfig
from tools.delegation_tools import DELEGATION_TOOLS


def get_orchestrator_config(policies, workspace, project_id=None, quarter="Q3"):
    """Build the Orchestrator agent configuration.

    The orchestrator does NOT have direct access to BigQuery or GCS tools.
    Instead, it delegates to specialist subagents via delegation tools:
      - delegate_to_data_researcher: queries BigQuery + lists GCS invoices
      - delegate_to_invoice_analyzer: reads and parses individual PDFs
      - delegate_to_reconciler: reconciles data + writes audit results
    """
    return LocalAgentConfig(
        system_instructions=f"""
        You are the Lead Financial Auditor orchestrating a team of specialist subagents.
        You MUST complete the entire reconciliation workflow in a single session.
        You have ONLY three tools: delegate_to_data_researcher, delegate_to_invoice_analyzer,
        and delegate_to_reconciler. Do NOT use any other tools.

        QUARTER: {quarter}

        You do NOT access BigQuery or GCS directly. Instead, you delegate to your
        specialist subagents using the tools below. Execute the steps IN ORDER:

        STEP 1 — DATA RESEARCH
        Call delegate_to_data_researcher(quarter="{quarter}").
        This spawns the Data Researcher subagent, who queries BigQuery for PENDING
        transactions and lists invoice PDFs in GCS. The subagent returns JSON with
        'transactions' and 'invoices' sections.

        STEP 2 — INVOICE ANALYSIS (ALL invoices, no exceptions)
        For EACH invoice path returned in Step 1, call
        delegate_to_invoice_analyzer(invoice_path="Q3/INV-xxxx.pdf").
        You MUST analyze ALL invoices before proceeding to Step 3.
        Do NOT call delegate_to_reconciler until every single invoice has been analyzed.

        STEP 3 — RECONCILIATION & AUDIT RESULTS (call EXACTLY ONCE)
        Only after ALL invoices from Step 2 have been analyzed, call
        delegate_to_reconciler(execution_id="AUDIT-{quarter}").
        The reconciler automatically receives all accumulated data from Steps 1 and 2.
        Call this EXACTLY ONCE — never call it multiple times.

        STEP 4 — FINAL COMPLIANCE REPORT
        After the reconciler completes, produce a FINAL COMPLIANCE REPORT in your
        response text. Include:
        - Total vendors audited
        - For each vendor: status (MATCHED/DISCREPANCY/ESCALATED), amounts, rationale
        - Summary count of matches vs discrepancies
        - Details of each discrepancy (vendor, amount difference, root cause)
        - Escalation recommendations for discrepancies over $1,000

        CRITICAL RULES:
        - Execute steps in strict order: 1 → 2 → 3 → 4
        - NEVER call delegate_to_reconciler before ALL invoices are analyzed
        - Call delegate_to_reconciler EXACTLY ONCE
        - Only use your three delegation tools — no other tools
        - Your final response MUST contain the full report text
        """,
        tools=DELEGATION_TOOLS,
        model="gemini-3.6-flash",
        policies=policies,
        workspaces=[workspace],
        vertex=True if project_id else None,
        project=project_id,
        location="global" if project_id else None,
    )
```

**What's happening here:**
- **Directive system instructions** — The model is told explicitly what to delegate at each step AND told not to stop partway. This is critical for multi-step delegation — vague instructions cause the model to halt after the first round.
- `tools=DELEGATION_TOOLS` — The Orchestrator gets ONLY the three delegation functions. It has **zero direct access** to BigQuery or GCS.
- `vertex=True` — Routes API calls through Vertex AI using Application Default Credentials (ADC).
- No `CapabilitiesConfig(enable_subagents=True)` needed — subagent spawning happens inside the delegation tools, not via the SDK's built-in subagent mechanism.

> 📎 See the full file: [orchestrator.py](https://github.com/rominirani/financial-audit-agent-tutorial/blob/main/agents/orchestrator.py)

`agents/data_researcher.py` — The BigQuery and GCS listing specialist. It receives the actual data tools (`query_vendor_transactions`, `list_invoices_in_gcs`) and restrictive policies that only allow those two specific functions. The Orchestrator spawns this agent via `delegate_to_data_researcher()`:
```python
from google.antigravity import LocalAgentConfig
from google.antigravity.hooks import policy
from tools.bigquery_tools import query_vendor_transactions, list_invoices_in_gcs


def get_data_researcher_config(workspace, project_id=None):
    """Build the Data Researcher subagent configuration.

    Args:
        workspace: Absolute path to the project workspace.
        project_id: GCP project ID for Vertex AI.
    """
    return LocalAgentConfig(
        system_instructions="""
        You are a Data Research Specialist. Your job is to:
        1. Query BigQuery for PENDING vendor transaction records
        2. List all invoice PDF files in the GCS bucket

        You have READ-ONLY access. You CANNOT write audit results or modify data.

        Return your results as structured JSON with two sections:
        {
            "transactions": [
                {"vendor_id": "...", "invoice_num": "...", "amount": ..., "currency": "...", "tax_rate": ..., "status": "..."},
                ...
            ],
            "invoices": [
                {"path": "Q3/INV-xxxx.pdf", "name": "INV-xxxx.pdf"},
                ...
            ],
            "summary": {
                "total_transactions": N,
                "total_invoices": N,
                "data_quality_issues": ["...", ...]
            }
        }
        """,
        tools=[query_vendor_transactions, list_invoices_in_gcs],
        model="gemini-3.5-flash-lite",
        policies=[
            policy.deny_all(),
            policy.allow("query_vendor_transactions"),

        project=project_id,
        location="global" if project_id else None,
    )
```

`agents/invoice_analyzer.py` — The PDF extraction specialist. It receives only `read_invoice_from_gcs` — it has **zero** BigQuery access and cannot list files. The Orchestrator tells it exactly which PDF to read. Even if this agent were compromised via a malicious PDF, it cannot touch the database or discover other files:

from google.antigravity import LocalAgentConfig
from google.antigravity.hooks import policy
from tools.bigquery_tools import read_invoice_from_gcs


def get_invoice_analyzer_config(workspace, project_id=None):

        - vendor_name: the vendor's name
        - invoice_num: the invoice number
        - base_amount: the pre-tax amount
        - tax_rate: the tax rate as a decimal (e.g. 0.10)
        - tax_amount: the calculated tax
        - total_amount: the total including tax
        - currency: the currency code (e.g. "USD")

        If any field cannot be extracted, set it to null and note the issue.

`agents/reconciler.py` — The only agent with **write access** to BigQuery. It receives `write_audit_result` and the mode-dependent policies from `main.py`. In staging, writes require human approval; in production, writes are auto-allowed but only with valid status values:
```python
from google.antigravity import LocalAgentConfig
from google.antigravity.hooks import policy
from tools.bigquery_tools import write_audit_result

# Defense in depth: only allow writes with valid status values.
# Even if the LLM hallucinates a status like "APPROVED" or "DELETE_ALL",
# this policy rejects it because it's not in VALID_STATUSES.
VALID_STATUSES = {"MATCHED", "DISCREPANCY", "ESCALATED", "UNMATCHED"}

RECONCILER_WRITE_POLICY = policy.allow(
    "write_audit_result",
    when=lambda args: args.get("status", "") in VALID_STATUSES,
    name="allow_valid_audit_writes",
)


def get_reconciler_config(policies, workspace, project_id=None):
    """Build the Reconciliation Engine subagent configuration.

    Args:
        policies: Mode-dependent policy list from the orchestrator tier.
        workspace: Absolute path to the project workspace.
        project_id: GCP project ID for Vertex AI.
    """
    # Combine mode policies with the hardcoded write validation.
    # The write validation is always active regardless of dev/staging/prod.
    reconciler_policies = list(policies) + [RECONCILER_WRITE_POLICY]

    return LocalAgentConfig(
        system_instructions="""
        You are a Reconciliation Engine. You receive two datasets:
        1. Transaction records from BigQuery (provided in the prompt)
        2. Invoice data extracted from PDFs (provided in the prompt)

        For each transaction-invoice pair:
        - Match by vendor_id and invoice_num
        - Compare transaction amount vs invoice total_amount (tolerance: $0.01)
        - Verify tax_rate matches
        - Check currency consistency

        Classify each pair as:
        - MATCHED: amounts match within tolerance
        - DISCREPANCY: amounts differ — include the difference and likely cause
        - UNMATCHED: transaction exists but no corresponding invoice found
        - ESCALATED: discrepancy exceeds $1,000 — requires human review

        For EACH reconciled pair, call write_audit_result() with:
        - execution_id (provided in the prompt)
        - vendor_id, invoice_num
        - transaction_amount, invoice_amount
        - status (MATCHED/DISCREPANCY/UNMATCHED/ESCALATED)
        - finding_details (rationale for the classification)
        - auditor (always "reconciliation-engine")

        After writing all results, produce a summary of your findings.
        """,
        tools=[write_audit_result],
        model="gemini-3.6-flash",
        policies=reconciler_policies,
        workspaces=[workspace],
        vertex=True if project_id else None,
        project=project_id,
        location="global" if project_id else None,
    )
```

Notice the **strict tool isolation** across the team:

| Agent | Tools Available | Can Read BQ? | Can Write BQ? | Can Read GCS? |
|:---|:---|:---:|:---:|:---:|
| **Orchestrator** | `delegate_to_*` (3 delegation tools) | ❌ | ❌ | ❌ |
| **Data Researcher** | `query_vendor_transactions`, `list_invoices_in_gcs` | ✅ | ❌ | ✅ (list only) |
| **Invoice Analyzer** | `read_invoice_from_gcs` | ❌ | ❌ | ✅ (read only) |
| **Reconciler** | `write_audit_result` | ❌ | ✅ (policy-gated) | ❌ |

Each subagent runs in its **own isolated `Agent` context** — spawned by the delegation tool, given only its designated tools, and torn down after completing its task. The Orchestrator never touches raw data; it can only interact with BigQuery and GCS through its specialist subagents.

**Step 5.5: Implement Observability Hooks** (`hooks/observability.py`)

Hooks are the SDK's mechanism for injecting cross-cutting concerns — logging, tracing, alerting — into the agent lifecycle without modifying the agent's core logic. We implement three hooks that integrate with **Cloud Logging** and **Cloud Trace** for production observability, while also printing to the console for local development.

```python
from google.antigravity.hooks import on_session_start, post_tool_call, on_session_end
from google.antigravity import types
from opentelemetry import trace
# ... Cloud Logging and Cloud Trace setup (see full file for details) ...

AGENT_NAME = "audit-orchestrator"
_active_span = None
_tool_call_count = 0


@on_session_start
async def audit_session_start():
    global _active_span, _tool_call_count
    _tool_call_count = 0
    _log("INFO", "Audit session started", event="SESSION_START", agent=AGENT_NAME)

    if CLOUD_TRACE_ENABLED:
        _active_span = _tracer.start_span("financial-audit-session")
        _active_span.set_attribute("audit.type", "vendor-reconciliation")
        _active_span.set_attribute("agent.name", AGENT_NAME)


@post_tool_call
async def audit_tool_invocation(data: types.ToolResult):
    """Create a child span explicitly parented under the session span."""
    global _tool_call_count
    _tool_call_count += 1
    tool_name = data.name if hasattr(data, 'name') else str(data)

    _log("INFO", f"Tool invoked: {tool_name}",
         event="TOOL_INVOCATION", agent=AGENT_NAME, tool=tool_name)

    if CLOUD_TRACE_ENABLED and _tracer and _active_span:
        # Key: set_span_in_context() parents tool spans under session span
        parent_ctx = trace.set_span_in_context(_active_span)
        tool_span = _tracer.start_span(f"tool:{tool_name}", context=parent_ctx)
        tool_span.set_attribute("tool.name", tool_name)
        tool_span.set_attribute("tool.call_index", _tool_call_count)
        tool_span.end()


# @on_session_end closes the session span and logs total_tool_calls

AUDIT_HOOKS = [audit_session_start, audit_tool_invocation, audit_session_end]
```

> 📎 See the full implementation with Cloud Logging/Trace setup and graceful degradation: [observability.py](https://github.com/rominirani/financial-audit-agent-tutorial/blob/main/hooks/observability.py)

**What each hook does:**
- `@on_session_start` — Fires when the agent session begins. Creates a root Cloud Trace span and logs the start event to Cloud Logging.
- `@post_tool_call` — Fires after every tool invocation. Receives a `types.ToolResult` object. Logs the tool name and `AGENT_NAME` to Cloud Logging. Creates a child span explicitly parented under the session span using `trace.set_span_in_context()` — this is what makes tool spans appear nested in the Cloud Trace waterfall.
- `@on_session_end` — Fires when the session ends. Records `total_tool_calls`, closes the trace span, and logs the completion event.

> **💡 Tip:** The hooks use graceful degradation — if `google-cloud-logging` or `opentelemetry` aren't installed, they fall back to console-only output. This means the same code works in both local development and production without conditional imports.

To enable Cloud Logging and Cloud Trace, install the additional dependencies:
```bash
pip install google-cloud-logging opentelemetry-api opentelemetry-sdk opentelemetry-exporter-gcp-trace
```

**Step 5.7: Write the Main Orchestration Script** (`main.py`)

This is the entry point that ties everything together. It parses command-line arguments, loads the policy set, **configures the delegation tools** so subagents get project_id and workspace, and sends the initial audit prompt. The `async with Agent(config)` context manager handles the agent lifecycle:
```python
import asyncio
import argparse
import os
from google.antigravity import Agent
from agents.orchestrator import get_orchestrator_config
from policies.audit_policies import DEVELOPMENT_POLICIES, STAGING_POLICIES, PRODUCTION_POLICIES
from hooks.observability import AUDIT_HOOKS
import tools.delegation_tools as delegation_tools

async def main():
    parser = argparse.ArgumentParser(description="Financial Audit Agent Team")
    parser.add_argument("--mode", choices=["dev", "staging", "prod"], default="dev")
    parser.add_argument("--quarter", default="Q3")
    parser.add_argument("--project-id", default=None, help="GCP project ID for Vertex AI")
    args = parser.parse_args()

    # Select policy set
    policies = {
        "dev": DEVELOPMENT_POLICIES,
        "staging": STAGING_POLICIES,
        "prod": PRODUCTION_POLICIES,
    }[args.mode]

    workspace_dir = os.path.abspath(os.path.dirname(__file__))

    # Configure delegation tools — subagents need project_id and workspace
    # to create their own Vertex AI connections. The reconciler also needs
    # the mode-dependent policies to control write access.
    delegation_tools.configure(
        project_id=args.project_id,
        workspace=workspace_dir,
        reconciler_policies=policies,
    )

    # Build orchestrator config — uses delegation tools, NOT direct data tools
    config = get_orchestrator_config(
        policies=policies,
        workspace=workspace_dir,
        project_id=args.project_id,
        quarter=args.quarter,
    )
    config.hooks = AUDIT_HOOKS

    print(f"🚀 Starting Financial Audit — Mode: {args.mode}, Quarter: {args.quarter}")
    print(f"📋 Policies: {len(policies)} rules loaded")
    print(f"🔗 Vertex AI: {args.project_id}")
    print(f"🤖 Subagents: Data Researcher → Invoice Analyzer → Reconciler\n")

    async with Agent(config) as agent:
        response = await agent.chat(
            f"Execute the full {args.quarter} vendor invoice reconciliation now. "
            f"Delegate to your specialist subagents: "
            f"first the Data Researcher to gather transaction data and invoice listings, "
            f"then the Invoice Analyzer for each PDF, "
            f"then the Reconciler to compare and write audit results. "
            f"Produce the final compliance report when all subagents have reported back."
        )

        # Print the agent's response
        print("\n" + "=" * 60)
        print("📊 AUDIT RESULTS")
        print("=" * 60)
        print(await response.text())

        # Token usage summary
        usage = agent.conversation.total_usage
        print(f"\n💰 Token Usage Summary:")
        print(f"   Prompt tokens:    {usage.prompt_token_count}")
        print(f"   Output tokens:    {usage.candidates_token_count}")
        print(f"   Thinking tokens:  {usage.thoughts_token_count}")
        print(f"   Total tokens:     {usage.total_token_count}")

if __name__ == "__main__":
    asyncio.run(main())
```

**What's new:** The `delegation_tools.configure()` call is the critical addition. It passes the `project_id`, `workspace`, and `reconciler_policies` to the delegation module so that when the Orchestrator calls `delegate_to_data_researcher()`, the spawned Data Researcher subagent gets proper Vertex AI credentials. Without this call, the subagents wouldn't know which GCP project to connect to.

> **🔑 Key Insight:** The `--project-id` flag specifies the GCP project for Vertex AI. In CI/CD pipelines, set this via environment variables. The `config.hooks = AUDIT_HOOKS` line enables observability for the entire agent hierarchy.

**5.8a: The Evaluation Dataset** — `eval/eval_dataset.jsonl`

Each line is a JSON object with three fields: `input` (the prompt to send), `expected_outcome` (keywords the response must contain), and `expected_tools` (which tools should be invoked):

```jsonl

{"input": "Reconcile vendor 1022 for Q3.", "expected_outcome": "match", "expected_tools": ["query_vendor_transactions", "list_invoices_in_gcs", "read_invoice_from_gcs"]}
{"input": "Reconcile vendor 3301 for Q3.", "expected_outcome": "currency, mismatch, EUR", "expected_tools": ["query_vendor_transactions", "list_invoices_in_gcs", "read_invoice_from_gcs"]}
{"input": "Reconcile vendor 5567 for Q3.", "expected_outcome": "duplicate, invoice", "expected_tools": ["query_vendor_transactions", "list_invoices_in_gcs", "read_invoice_from_gcs"]}
```

**5.8b: The Eval Runner Script** — `eval/run_eval.py`

This script loads the dataset, sends each test case to the agent, and checks whether the expected keywords appear in the response. It reuses the same `Agent` API and orchestrator config from `main.py`:

```python
async def run_eval(eval_file: str, project_id: str):
    """Run each eval case and check agent output against expected keywords."""
    with open(eval_file) as f:
        cases = [json.loads(line) for line in f if line.strip()]

    config = get_orchestrator_config(
        policies=DEVELOPMENT_POLICIES, workspace=workspace_dir, project_id=project_id,
    )
    config.hooks = AUDIT_HOOKS

    passed = 0
    async with Agent(config) as agent:
        for case in cases:
            response = await agent.chat(case["input"])
            result = await response.text()

            # Check if ALL expected keywords appear in the response
            keywords = [kw.strip().lower() for kw in case["expected_outcome"].split(",")]
            missing = [kw for kw in keywords if kw not in result.lower()]

            if not missing:
                print(f"✅ PASS")
                passed += 1
            else:
                print(f"❌ FAIL — missing keywords: {missing}")
```

│  ├─ tool:read_invoice_from_gcs × 4 (1.2s each — PDF download + parse)
│  ├─ tool:write_audit_result × 20 (0.3s each)
│  └─ [LLM reasoning gaps visible as unlabeled blocks]
```

> **🔑 Key Insight:** Cloud Trace is invaluable for identifying performance bottlenecks. If a tool call is taking 10x longer than expected, the trace waterfall will show it immediately. In production, set up [alerting policies](https://console.cloud.google.com/monitoring/alerting) on trace latency to catch regressions.

**Step 5.11: Deploy to Cloud Run**

The repository includes a `Dockerfile` and `server.py` that wrap the agent in a Flask HTTP server for Cloud Run deployment. The server uses `PRODUCTION_POLICIES` (fully autonomous, no human prompts) since there's no terminal for interactive approval.

**5.11a: The Dockerfile**

The Dockerfile uses `python:3.11-slim` with gunicorn as the production WSGI server. The 300-second timeout accommodates the agent's multi-step reconciliation workflow:
```dockerfile
FROM python:3.11-slim

WORKDIR /app

# Install system dependencies
RUN apt-get update && apt-get install -y --no-install-recommends \
    && rm -rf /var/lib/apt/lists/*

# Install Python dependencies
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt flask gunicorn

# Copy application code
COPY . .

# Cloud Run sets PORT env var (default 8080)
ENV PORT=8080

# Run with gunicorn for production
CMD exec gunicorn --bind :$PORT --workers 1 --threads 8 --timeout 300 server:app
```

**5.11b: The HTTP Server** (`server.py`)

The server exposes two endpoints: `POST /audit` to run the reconciliation and `GET /health` for Cloud Run health checks. It reads `PROJECT_ID` from the environment variable (set during deployment):
```python
from flask import Flask, request, jsonify
from google.antigravity import Agent
from agents.orchestrator import get_orchestrator_config
from policies.audit_policies import PRODUCTION_POLICIES
from hooks.observability import AUDIT_HOOKS
import tools.delegation_tools as delegation_tools

app = Flask(__name__)

@app.route("/audit", methods=["POST"])
def run_audit():
    data = request.get_json(silent=True) or {}
    quarter = data.get("quarter", "Q3")
    project_id = os.environ.get("PROJECT_ID")
    result = asyncio.run(_execute_audit(quarter, project_id))
    return jsonify(result)

@app.route("/health", methods=["GET"])
def health():
    return jsonify({"status": "healthy"}), 200
```

> 📎 See the full server with async agent execution: [server.py](https://github.com/rominirani/financial-audit-agent-tutorial/blob/main/server.py)

**5.11c: Deploy to Cloud Run**
```bash
# Deploy directly from source (Cloud Build + Cloud Run in one step)
gcloud run deploy financial-audit-agent \
  --source . \
  --region us-central1 \
  --set-env-vars PROJECT_ID=$PROJECT_ID \
  --timeout 300 \
  --memory 1Gi \
  --service-account audit-agent-sa@$PROJECT_ID.iam.gserviceaccount.com \
  --no-allow-unauthenticated
```

**5.11d: Invoke the Deployed Agent**
```bash
# Get the service URL
SERVICE_URL=$(gcloud run services describe financial-audit-agent \
  --region us-central1 --format 'value(status.url)')

# Invoke with authentication
curl -X POST "$SERVICE_URL/audit" \
  -H "Authorization: Bearer $(gcloud auth print-identity-token)" \
  -H "Content-Type: application/json" \
  -d '{"quarter": "Q3"}'
```

The response is a JSON object containing the full compliance report and token usage:
```json
{
  "quarter": "Q3",
  "report": "## Final Compliance Report\n\n### Vendor 8492 — DISCREPANCY...",
  "token_usage": {
    "prompt_tokens": 32054,
    "output_tokens": 1200,
    "total_tokens": 33254
  }
}
```

> **🔑 Key Insight:** The same code runs locally (`python main.py`) and on Cloud Run (`server.py`). The difference is the entry point: CLI vs HTTP. The `PROJECT_ID` is read from an environment variable (`os.environ.get("PROJECT_ID")`) so no code changes are needed between environments.
